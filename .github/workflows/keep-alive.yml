name: Keep Services Alive

on:
  schedule:
    # Ping every 10 minutes — Render free tier sleeps after 15 min of inactivity
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend and Frontend
        run: |
          echo "Pinging backend actuator health endpoint..."
          BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 45 \
            https://premium-url-shortener-backend.onrender.com/actuator/health || true)
          echo "Backend response: $BACKEND_STATUS"

          echo "Pinging frontend..."
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 45 \
            https://premium-url-shortener-frontend.onrender.com/ || true)
          echo "Frontend response: $FRONTEND_STATUS"
